name = "ssw-readytofly"
main = "worker/src/index.js"
compatibility_date = "2026-11-08"
workers_dev = true

[vars]
APP_ORIGIN = "https://ssw-readytofly.madusanka-lahiru.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "readytofly-db"
database_id = "363d4ade-f519-4f67-8f17-66e8b5fd7293"
migrations_dir = "migrations"


[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Preview-only binding required by the current Cloudflare Workers Builds
# preview configuration. This does not change the Production bindings.
[[previews.send_email]]
name = "EMAIL"

# Isolated D1 and origin for Cloudflare Worker Previews.
[previews.vars]
APP_ORIGIN = "https://feature-zero-cost-auth-autosave-v2-ssw-readytofly.madusanka-lahiru.workers.dev"

[[previews.d1_databases]]
binding = "DB"
database_name = "readytofly-preview-db"
database_id = "a0ffc739-d672-489e-aa39-6fc53888ef9d"
migrations_dir = "migrations"
