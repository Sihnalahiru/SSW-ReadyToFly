name = "readytofly-auth"
main = "worker/src/index.js"
compatibility_date = "2026-11-08"
workers_dev = true

[vars]
APP_ORIGIN = "https://REPLACE-WITH-YOUR-APP-DOMAIN"
MAIL_FROM = "ReadyToFly <noreply@REPLACE-WITH-YOUR-DOMAIN>"

[[d1_databases]]
binding = "DB"
database_name = "readytofly-db"
database_id = "363d4dae-f519-4f67-8f17-66e8b5fd7293"
migrations_dir = "migrations"

# Add secrets with Wrangler; never commit secret values:
# npx wrangler secret put RESEND_API_KEY
# npx wrangler secret put MAIL_FROM

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
