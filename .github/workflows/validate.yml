name: ReadyToFly validation

on:
  pull_request:
  push:
    branches:
      - feature/zero-cost-auth-autosave-v2

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app and Worker JavaScript plus runtime JSON
        run: node validation/validate-static.mjs
      - name: Validate study data index structure
        run: node validation/validate-data.mjs
      - name: Validate study and vocabulary image mappings
        run: node validation/validate-study-images.mjs
      - name: Validate authentication and password-reset contracts
        run: node validation/validate-auth-contract.mjs
      - name: Validate consolidated data-to-UI invariants
        run: node validation/validate-data-to-ui.mjs
      - name: Install Chromium for browser regression tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static app server
        run: |
          python3 -m http.server 4173 --directory public > /tmp/readytofly-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
      - name: Run desktop/mobile browser regression and account-progress persistence contract
        run: node validation/e2e-readytofly.mjs
